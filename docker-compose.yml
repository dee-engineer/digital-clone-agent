services:
  agent:
    build: ./agent
    env_file: .env
    environment:
      CHROMA_PATH: /data/chroma
      STATE_DB: /data/state.db
      PERSONA_STORE: /data/persona.md
      CUSTOM_SKILLS_DIR: /srv/custom_skills
    volumes:
      - agent_data:/data
      - ./data/knowledge:/knowledge:ro
      - ./skills:/srv/custom_skills:ro
    ports:
      - "127.0.0.1:8000:8000"   # local only; put a reverse proxy + TLS in front to expose it
    restart: unless-stopped

  # Optional: Gmail automation. Start with: docker compose --profile automation up -d
  n8n:
    profiles: ["automation"]
    image: docker.n8n.io/n8nio/n8n:latest
    env_file: .env
    environment:
      GENERIC_TIMEZONE: UTC
      N8N_SECURE_COOKIE: "false"   # set true behind HTTPS
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  agent_data:
  n8n_data:
