<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#050A3A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#2338E6"/>

  <!-- wordmark: original + its copy -->
  <g transform="translate(72,58)">
    <rect x="9" y="9" width="30" height="30" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="0" y="0" width="30" height="30" rx="8" fill="#FFFFFF"/>
    <text x="52" y="27" font-family="Inter" font-weight="600" font-size="22" fill="#FFFFFF">digital-clone-agent</text>
  </g>

  <!-- headline -->
  <g font-family="Archivo Black, Inter" font-size="66" fill="#FFFFFF" letter-spacing="-1">
    <text x="72" y="196">Drafts in</text>
    <text x="72" y="266">your voice.</text>
    <text x="72" y="346">Waits for</text>
    <text x="72" y="416">your yes.</text>
  </g>
  <g font-family="Inter" font-size="21" fill="#FFFFFF" fill-opacity="0.88">
    <text x="72" y="474">A self-hosted AI clone that writes emails,</text>
    <text x="72" y="502">proposals and security reports from your own notes.</text>
  </g>

  <!-- stack -->
  <g font-family="Inter" font-size="15" font-weight="600" fill="#FFFFFF">
    <g transform="translate(72,556)">
      <rect width="86" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/><text x="43" y="22.5" text-anchor="middle">Gemini</text>
    </g>
    <g transform="translate(168,556)">
      <rect width="104" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/><text x="52" y="22.5" text-anchor="middle">LangGraph</text>
    </g>
    <g transform="translate(282,556)">
      <rect width="58" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/><text x="29" y="22.5" text-anchor="middle">n8n</text>
    </g>
    <g transform="translate(350,556)">
      <rect width="82" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/><text x="41" y="22.5" text-anchor="middle">Chroma</text>
    </g>
  </g>

  <!-- the clone's copy (behind) -->
  <g transform="rotate(-3 940 320)">
    <rect x="668" y="78" width="520" height="440" rx="22" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="676" y="64" font-family="Inter" font-weight="600" font-size="15" fill="#FFFFFF" fill-opacity="0.9">clone draft</text>
  </g>

  <!-- the card you approve (front) -->
  <g transform="rotate(2 960 330)" filter="url(#sh)">
    <rect x="712" y="112" width="500" height="430" rx="20" fill="#F5F7FC"/>
    <g transform="translate(712,112)" font-family="Inter">
      <text x="30" y="52" font-weight="700" font-size="21" fill="#0B1030">Re: Pentest quote, web and API</text>
      <text x="30" y="78" font-size="14" fill="#5A6385">to ada@acmecorp.com</text>
      <g transform="translate(298,60)">
        <rect width="172" height="30" rx="15" fill="#FFE9E3"/>
        <circle cx="18" cy="15" r="5" fill="#FF5533"/>
        <text x="30" y="20" font-size="13" font-weight="600" fill="#8A2410">Waiting for your yes</text>
      </g>
      <line x1="30" y1="104" x2="470" y2="104" stroke="#DDE2F0" stroke-width="1.5"/>
      <g font-size="17" fill="#1B2240">
        <text x="30" y="146">Hi Ada,</text>
        <text x="30" y="176">Thanks for reaching out. We can scope an external</text>
        <text x="30" y="204">web and API test and send a fixed-fee proposal</text>
        <rect x="30" y="215" width="112" height="26" rx="5" fill="#FFE27A"/>
        <text x="30" y="233">by Friday.</text>
        <text x="146" y="233">Could you share your</text>
        <text x="30" y="261">target list and preferred testing window?</text>
      </g>
      <!-- human edit marker -->
      <g transform="translate(340,215)">
        <rect width="126" height="26" rx="13" fill="#2338E6"/>
        <rect x="10" y="8" width="10" height="10" rx="3" fill="#FFE27A"/>
        <text x="26" y="18" font-size="13" font-weight="600" fill="#FFFFFF">edited by you</text>
      </g>
      <text x="30" y="318" font-size="14" fill="#5A6385">Drafted from</text>
      <g font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#1B2240">
        <rect x="124" y="302" width="102" height="26" rx="6" fill="#E6EAF7"/><text x="175" y="320" text-anchor="middle">services.pdf</text>
        <rect x="234" y="302" width="96" height="26" rx="6" fill="#E6EAF7"/><text x="282" y="320" text-anchor="middle">pricing.md</text>
        <rect x="338" y="302" width="118" height="26" rx="6" fill="#E6EAF7"/><text x="397" y="320" text-anchor="middle">past-quotes.md</text>
      </g>
      <g font-family="Inter" font-size="16" font-weight="700">
        <rect x="30" y="360" width="208" height="52" rx="12" fill="#FF5533"/>
        <text x="134" y="392" text-anchor="middle" fill="#0B1030">Approve and send</text>
        <rect x="252" y="360" width="104" height="52" rx="12" fill="none" stroke="#C5CCE2" stroke-width="2"/>
        <text x="304" y="392" text-anchor="middle" fill="#3A4366" font-weight="600">Reject</text>
      </g>
    </g>
  </g>
</svg>
